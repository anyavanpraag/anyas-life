<style>
:root{
  --cream:#F4EEE3;
  --panel:#E6DDCC;
  --card:#F4EEE3;
  --border:#B3A28F;
  --text:#4A3B32;
  --text2:#8A7A6C;
  --muted:#C9BBA6;
  --pink:#F4D1D6;
  --pink-text:#7C6357;
  --pink-strong:#E9A3AD;
  --tan:#E6DDCC;
  --tan-text:#7C6357;
  --accent:#B3A28F;
  --dot-hoy:#F0B8C4;
  --dot-uni:#A8C5E0;
  --dot-evento:#F0D383;
  --dot-pagos:#BFE3B0;
  --dot-kawai:#C2504F;
  --dot-compras:#8B6F47;
  --card-bg:#FFFFFF;
  --card-shadow:rgba(74,55,40,0.08);
  --topbar-bg:rgba(233,163,173,0.92);
  --navbar-bg:rgba(230,221,204,0.78);
  --drag-shadow:rgba(0,0,0,0.15);
}
@media (prefers-color-scheme: dark){
  :root{
    --cream:#1E1A17;
    --panel:#2A2420;
    --card:#1E1A17;
    --border:#4A4038;
    --text:#F0E6DC;
    --text2:#C4B5A8;
    --muted:#6B5F54;
    --pink:#4A3038;
    --pink-text:#E8C4CC;
    --pink-strong:#8A6058;
    --tan:#3A322A;
    --tan-text:#D4C4B4;
    --accent:#B3A28F;
    --card-bg:#2A2420;
    --card-shadow:rgba(0,0,0,0.4);
    --topbar-bg:rgba(74,48,56,0.6);
    --navbar-bg:rgba(42,36,32,0.85);
    --drag-shadow:rgba(0,0,0,0.5);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{padding-bottom:82px;padding-top:calc(72px + env(safe-area-inset-top));}
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--topbar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;max-width:480px;margin:0 auto;}
.topbar-brand{font-size:12px;font-weight:700;color:#FFFFFF;letter-spacing:0.5px;text-transform:uppercase;}
.topbar-screen{font-size:28px;font-weight:700;color:#FFFFFF;margin-top:2px;}
.app{max-width:480px;margin:0 auto;}
.screen{display:none;padding:18px 16px 8px;}
.screen.active{display:block;}
h1.title{font-size:24px;font-weight:600;color:var(--text);margin:8px 0 2px;}
p.subtitle{font-size:15px;color:var(--text2);margin:0 0 14px;}
.screen-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
.plus-btn{background:var(--pink);color:var(--text);border:none;width:32px;height:32px;min-width:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.card{background:var(--card-bg);border:none;box-shadow:0 1px 3px var(--card-shadow);border-radius:18px;padding:14px 16px;margin-bottom:14px;}
.card-title{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--text2);}
input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:22px;border:2px solid var(--border);border-radius:7px;background:#fff;position:relative;cursor:pointer;margin:0;}
input[type="checkbox"]:checked{background:var(--pink-strong);border-color:var(--pink-strong);}
input[type="checkbox"]:checked::after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.item-row{display:flex;align-items:center;gap:8px;padding:7px 0;}
.item-row.dragging{background:var(--panel);box-shadow:0 2px 8px var(--drag-shadow);border-radius:8px;}
.item-row-col{border-bottom:1px solid var(--border);padding-bottom:2px;margin-bottom:2px;}
.item-row-col:last-child{border-bottom:none;}
.item-text{flex:1;min-width:0;font-size:17px;color:var(--text);white-space:normal;word-wrap:break-word;overflow-wrap:break-word;}
.item-text.done{color:var(--muted);text-decoration:line-through;}
.del-btn{background:none;border:none;color:var(--accent);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;}
.deadline-cap{font-size:14px;color:var(--accent);margin:0 0 6px 28px;}
.deadline-cap.overdue{color:#C2504F;font-weight:600;}
.add-row{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--border);margin-top:4px;cursor:pointer;}
.add-row.hidden{display:none;}
.hidden{display:none;}
.add-plus{color:var(--accent);font-size:18px;}
.add-label{font-size:15px;color:var(--accent);}
.add-form{padding-top:8px;border-top:1px solid var(--border);margin-top:4px;}
.add-form.hidden{display:none;}
.add-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:16px;background:#fff;color:var(--text);margin-bottom:8px;}
.add-date-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.add-date-row input{border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:15px;background:#fff;color:var(--text);}
.sinfecha-label{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text2);white-space:nowrap;}
.add-error{color:#B23B3B;font-size:14px;margin-bottom:8px;}
.add-error.hidden{display:none;}
.add-actions{display:flex;justify-content:flex-end;gap:8px;}
.btn-cancel,.btn-save{border:none;border-radius:8px;padding:7px 14px;font-size:15px;cursor:pointer;}
.btn-cancel{background:transparent;color:var(--text2);}
.btn-save{background:var(--pink-strong);color:#fff;}
.empty-hint{font-size:15px;color:var(--muted);margin:4px 0;}
.tag{font-size:13px;padding:2px 8px;border-radius:8px;white-space:nowrap;}
.tag-uni{background:var(--pink);color:var(--pink-text);}
.tag-kawai{background:var(--tan);color:var(--tan-text);}
.tag-compras{background:var(--tan);color:var(--tan-text);}
.tag-general{background:var(--panel);color:var(--text2);}
.tag-pagos{background:var(--tan);color:var(--tan-text);}
.tag-evento{background:var(--tan);color:var(--tan-text);}
.navbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 2px calc(12px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;}
.navitem{flex:1;text-align:center;cursor:pointer;padding:4px 0;}
.navicon-wrap{position:relative;z-index:1;display:inline-block;padding:8px 18px;border-radius:999px;}
.nav-indicator{position:absolute;top:0;left:0;background:var(--pink-strong);border-radius:999px;z-index:0;transform:translate(0,0);transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);will-change:transform;cursor:grab;}
.navicon{display:block;}
.week-strip{display:flex;background:var(--card-bg);border:none;box-shadow:0 1px 3px var(--card-shadow);border-radius:18px;padding:10px 6px;margin-bottom:14px;}
.week-col{flex:1;text-align:center;}
.week-letter{font-size:13px;color:var(--text2);}
.week-daynum{font-size:15px;color:var(--text);padding:4px 0;}
.week-daynum.today{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--pink);color:var(--text);}
.week-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin:2px auto 0;}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;grid-auto-rows:minmax(40px,auto);}
.mgrid-head{text-align:center;font-size:13px;color:var(--text2);padding:5px 0;}
.mgrid-cell{padding:4px 3px 6px;border-radius:10px;background:#F4EEE3;overflow:hidden;}
.mgrid-cell.today{background:var(--pink);}
.mgrid-num{font-size:13px;color:var(--text);text-align:center;}
.mgrid-num.muted{color:var(--muted);}
.mgrid-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px;}
.mgrid-dots.hidden{display:none;}
.mgrid-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.mgrid-cell.expanded{background:var(--panel);}
.mgrid-detail{margin-top:4px;}
.mgrid-detail.hidden{display:none;}
.mgrid-detail-line{font-size:13px;line-height:1.3;word-wrap:break-word;margin-bottom:2px;}
.legend{display:flex;gap:14px;padding:8px 2px 0;font-size:13px;color:var(--text2);}
.legend-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}
.accordion-wrap{background:var(--card-bg);border:none;box-shadow:0 1px 3px var(--card-shadow);border-radius:18px;overflow:hidden;margin-bottom:14px;}
details.materia{border-bottom:1px solid var(--border);}
details.materia:last-child{border-bottom:none;}
details.materia>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 14px;}
details.materia>summary::-webkit-details-marker{display:none;}
.materia-name{font-size:16px;color:var(--text);flex:1;}
.count-badge{font-size:13px;background:var(--pink);color:var(--pink-text);padding:2px 9px;border-radius:10px;margin-right:6px;font-weight:600;}
.edit-btn{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:2px 6px;}
.chev{color:var(--text2);transition:transform .2s;}
details[open] .chev{transform:rotate(180deg);}
.materia-body{padding:0 14px 12px;}
.materia-edit-input{font-size:16px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;flex:1;}
table.pagos-table{width:100%;border-collapse:collapse;table-layout:fixed;}
table.pagos-table th{font-size:13px;font-weight:600;color:var(--text2);text-align:center;padding:6px 6px;border-bottom:1px solid var(--border);}
table.pagos-table td{font-size:15px;color:var(--text);padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;}
table.pagos-table th:nth-child(1),table.pagos-table td:nth-child(1){width:30%; text-align:left;}
table.pagos-table th:nth-child(2),table.pagos-table td:nth-child(2){width:15%;}
table.pagos-table th:nth-child(3),table.pagos-table td:nth-child(3){width:14%;}
table.pagos-table th:nth-child(4),table.pagos-table td:nth-child(4){width:11%;}
table.pagos-table th:nth-child(5){width:24%; text-align:center;}
table.pagos-table td:nth-child(5){width:24%; text-align:left;}
table.pagos-table th:nth-child(6),table.pagos-table td:nth-child(6){width:6%;}
.cell-display{cursor:pointer;display:inline-block;padding:2px 0;}
.cell-display.placeholder{color:var(--muted);}

</style>

<script>
/* ---------- helpers ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const MESES_CORTOS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDate(iso){
  if(!iso) return '';
  const parts=iso.split('-');
  return parseInt(parts[2],10)+' '+MESES_CORTOS[parseInt(parts[1],10)-1];
}
function fmtTime(hhmm){
  if(!hhmm) return '';
  const parts=hhmm.split(':');
  let h=parseInt(parts[0],10);
  const m=parts[1];
  const ampm = h>=12 ? 'pm':'am';
  h = h%12; if(h===0) h=12;
  return h+':'+m+' '+ampm;
}
function fmtDiaMes(dia,mes){
  if(!dia && !mes) return 'Sin fecha';
  if(!dia) return MESES_CORTOS[mes-1];
  if(!mes) return String(dia);
  return dia+' '+MESES_CORTOS[mes-1];
}
function parseMonto(s){
  if(!s) return 0;
  const cleaned=String(s).replace(/[^0-9.\-]/g,'');
  const n=parseFloat(cleaned);
  return isNaN(n)?0:n;
}
function fmtTotal(n){
  const rounded=Math.round(n*100)/100;
  const negative=rounded<0;
  const parts=Math.abs(rounded).toFixed(2).split('.');
  let intPart=parts[0];
  const decPart=parts[1];
  let withThousands='';
  for(let i=0;i<intPart.length;i++){
    if(i>0 && (intPart.length-i)%3===0) withThousands+='.';
    withThousands+=intPart[i];
  }
  return (negative?'-':'')+withThousands+','+decPart;
}
function isOverdue(item){
  if(item.done || !item.date) return false;
  const todayISO=toISO(new Date());
  if(item.date<todayISO) return true;
  if(item.date===todayISO && item.time){
    const now=new Date();
    const nowHM=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    return item.time<nowHM;
  }
  return false;
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function catLabel(c){
  return {uni:'Uni',kawai:'Kawai',compras:'Compras',pagos:'Pagos',general:'General',evento:'Evento'}[c]||'';
}

/* ---------- storage ---------- */
const STORAGE_KEY='anyas-life-v1';
let store=null;
const COMPRAS_CATS=[
  {id:'super',name:'Supermercado'},
  {id:'delivery',name:'Delivery'},
  {id:'farmacia',name:'Farmacia'},
  {id:'otros',name:'Otros'},
  {id:'wishlist',name:'Wishlist'}
];
function defaultStore(){
  return {
    hoy:{ manana:[], tarde:[], pronto:[], lastReset:null },
    pendientes:[],
    uniMaterias:Array.from({length:9},(_,i)=>({id:'m'+(i+1),name:'Materia '+(i+1)})),
    pagosMensuales:[],
    pagosProximos:[],
    tasas:{ valores:{'$':null,'€':null,'Paralelo':null}, actualizado:null }
  };
}
const TASA_OPTIONS=['$','€','Paralelo'];
function migratePagoItem(p){
  if(p.dia!==undefined){
    if(p.tasa==='Otro') p.tasa='Paralelo';
    if(p.tasa==='Dólar BCV') p.tasa='$';
    if(p.tasa==='Euro BCV') p.tasa='€';
    return p;
  }
  let dia=null, mes=null;
  if(p.fecha){
    const parts=p.fecha.split('-');
    mes=parseInt(parts[1],10); dia=parseInt(parts[2],10);
  }
  return {id:p.id, pago:p.pago, dia:dia, mes:mes, monto:p.monto, tasa:null};
}
function migrateStore(s){
  if(!s.hoy) s.hoy={ manana:[], tarde:[], pronto:[], lastReset:null };
  if(s.hoy.lastReset===undefined) s.hoy.lastReset=null;
  if(!s.pagosMensuales && !s.pagosProximos){
    s.pagosMensuales = s.pagos || [];
    s.pagosProximos = [];
  }
  if(!s.pagosProximos) s.pagosProximos=[];
  if(!s.pagosMensuales) s.pagosMensuales=[];
  if(!s.tasas) s.tasas={ valores:{'$':null,'€':null,'Paralelo':null}, actualizado:null };
  if(s.tasas.valores && (s.tasas.valores['Dólar BCV']!==undefined || s.tasas.valores['Euro BCV']!==undefined)){
    s.tasas.valores={
      '$': s.tasas.valores['$']||s.tasas.valores['Dólar BCV']||null,
      '€': s.tasas.valores['€']||s.tasas.valores['Euro BCV']||null,
      'Paralelo': s.tasas.valores['Paralelo']||null
    };
  }
  s.pagosMensuales = s.pagosMensuales.map(migratePagoItem);
  s.pagosProximos = s.pagosProximos.map(migratePagoItem);
  delete s.pagos;
  return s;
}
const hasClaudeStorage = (typeof window.storage!=='undefined' && window.storage && typeof window.storage.get==='function');
async function loadStore(){
  if(hasClaudeStorage){
    try{
      const res=await window.storage.get(STORAGE_KEY);
      store = res ? migrateStore(JSON.parse(res.value)) : defaultStore();
      return;
    }catch(e){ /* fall through to local storage below */ }
  }
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    store = raw ? migrateStore(JSON.parse(raw)) : defaultStore();
  }catch(e){
    store=defaultStore();
  }
}
async function saveStore(){
  if(hasClaudeStorage){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(store)); return; }
    catch(e){ /* fall through to local storage below */ }
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch(e){
    console.error('no se pudo guardar', e);
    showToast('No se pudo guardar. Revisa e intenta de nuevo.');
  }
}
function toggleItem(list,id){ const it=list.find(i=>i.id===id); if(it){ it.done=!it.done; saveStore(); } }
function deleteItem(list,id){ const idx=list.findIndex(i=>i.id===id); if(idx>-1){ list.splice(idx,1); saveStore(); } }

function allPagosCombined(){
  return store.pagosMensuales.concat(store.pagosProximos);
}
function pagosForISO(iso){
  if(!iso) return [];
  const parts=iso.split('-');
  const mm=parseInt(parts[1],10), dd=parseInt(parts[2],10);
  return allPagosCombined().filter(function(p){ return p.dia===dd && p.mes===mm; });
}

/* ---------- toast ---------- */
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2600);
}
function showUndoToast(msg, onUndo){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML='';
  const span=document.createElement('span'); span.textContent=msg;
  const btn=document.createElement('button');
  btn.textContent='Deshacer';
  btn.style.cssText='margin-left:10px;background:none;border:none;color:#E7D0CA;font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit;';
  btn.onclick=function(){ t.classList.remove('show'); onUndo(); };
  t.appendChild(span); t.appendChild(btn);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),5000);
}
function deleteWithUndo(list, id, rerender){
  const idx=list.findIndex(function(x){ return x.id===id; });
  if(idx===-1) return;
  const item=list[idx];
  list.splice(idx,1);
  saveStore(); rerender();
  showUndoToast('Eliminado', function(){
    list.splice(idx,0,item);
    saveStore(); rerender();
  });
}

/* ---------- BCV rates (best-effort, refreshed once a day, cached in store) ---------- */
function parseVeNumber(s){
  const cleaned=String(s).replace(/\./g,'').replace(',', '.');
  const n=parseFloat(cleaned);
  return isNaN(n)?null:n;
}
function extractRatePrice(data){
  if(!data) return null;
  if(typeof data.price==='number') return data.price;
  if(data.monitors){
    const keys=Object.keys(data.monitors);
    for(let i=0;i<keys.length;i++){
      const m=data.monitors[keys[i]];
      if(m && typeof m.price==='number') return m.price;
    }
  }
  return null;
}
async function fetchFromDolarApi(){
  const resp=await fetch('https://ve.dolarapi.com/v1/dolares');
  const data=await resp.json();
  let oficial=null, paralelo=null;
  if(Array.isArray(data)){
    data.forEach(function(item){
      if(item && item.fuente==='oficial' && typeof item.promedio==='number') oficial=item.promedio;
      if(item && item.fuente==='paralelo' && typeof item.promedio==='number') paralelo=item.promedio;
    });
  }
  return {oficial:oficial, paralelo:paralelo};
}
async function fetchEuroFromDolarApiMonedas(){
  const resp=await fetch('https://ve.dolarapi.com/v1/monedas');
  const data=await resp.json();
  if(Array.isArray(data)){
    for(let i=0;i<data.length;i++){
      const item=data[i];
      const code=String(item.moneda||item.codigo||item.nombre||'').toLowerCase();
      if(code.indexOf('eur')!==-1 && typeof item.promedio==='number') return item.promedio;
    }
  }
  return null;
}
async function fetchEuroFromMonitor(){
  const resp=await fetch('https://www.monitordedivisavenezuela.com/');
  const html=await resp.text();
  const m=html.match(/eur[o]?[\s\S]{0,200}?([0-9]{1,3}(?:[.,][0-9]{3})*[.,][0-9]{2})/i);
  if(m) return parseVeNumber(m[1]);
  return null;
}
async function fetchTasasIfNeeded(force){
  const todayISO=toISO(new Date());
  if(!force && store.tasas && store.tasas.actualizado===todayISO) return;
  const statusEl=document.getElementById('tasas-status');
  if(statusEl) statusEl.textContent='Actualizando tasas…';
  let dolarBcv=null, euroBcv=null, paralelo=null;
  try{
    const d=await fetchFromDolarApi();
    dolarBcv=d.oficial;
    paralelo=d.paralelo;
  }catch(e){ /* dolarapi.com no respondió, seguimos con el respaldo abajo */ }
  try{ euroBcv=await fetchEuroFromDolarApiMonedas(); }catch(e){ /* seguimos intentando */ }
  if(!euroBcv){
    try{ euroBcv=await fetchEuroFromMonitor(); }catch(e){ /* seguimos intentando */ }
  }
  try{
    const [dResp,eResp,pResp]=await Promise.all([
      fetch('https://pydolarve.org/api/v1/dollar?page=bcv'),
      fetch('https://pydolarve.org/api/v1/euro?page=bcv'),
      fetch('https://pydolarve.org/api/v1/dollar?page=enparalelovzla')
    ]);
    if(!dolarBcv) dolarBcv=extractRatePrice(await dResp.json());
    if(!euroBcv) euroBcv=extractRatePrice(await eResp.json());
    if(!paralelo) paralelo=extractRatePrice(await pResp.json());
  }catch(e){
    console.error('no se pudieron actualizar las tasas', e);
  }
  if(dolarBcv||euroBcv||paralelo){
    store.tasas={ valores:{'$':dolarBcv,'€':euroBcv,'Paralelo':paralelo}, actualizado:todayISO };
    saveStore();
    if(document.getElementById('screen-pagos').classList.contains('active')) renderPagos();
    if(force) showToast('Tasas actualizadas');
  } else if(force){
    showToast('No se pudieron leer las tasas automáticamente, intenta más tarde');
    renderPagos();
  }
}
function tasaFactor(tasaName){
  if(!tasaName) return 1;
  if(store.tasas && store.tasas.valores && store.tasas.valores[tasaName]) return store.tasas.valores[tasaName];
  return null;
}

/* ---------- calendar sync (best-effort, non-blocking) ---------- */
async function syncDeadlineToCalendar(item){
  try{
    const when = item.time
      ? ('el '+item.date+' a las '+item.time)
      : ('el '+item.date+', usando las 9:00 am como hora de inicio');
    const prompt = 'Crea un evento en Google Calendar en el calendario principal del usuario. '
      + 'Título: "'+item.text+'". Programa el evento '+when+', duración de 30 minutos, zona horaria America/Caracas. '
      + 'Configura un recordatorio tipo popup en el minuto 0 antes del inicio. '
      + 'Solo crea el evento usando la herramienta de calendario disponible, no respondas con texto ni hagas preguntas de vuelta.';
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}],
        mcp_servers:[{type:'url',url:'https://calendarmcp.googleapis.com/mcp/v1',name:'google-calendar'}]
      })
    });
    const data=await resp.json();
    const ok=(data.content||[]).some(b=>b.type==='mcp_tool_result');
    showToast(ok?'Recordatorio programado en tu calendario':'Guardado. No pude confirmar el recordatorio.');
  }catch(e){
    showToast('Guardado. El recordatorio en Calendar solo se crea abriendo la app dentro de Claude.');
  }
}

/* ---------- reusable list renderers ---------- */
function renderChecklistInto(container, items, handlers){
  container.innerHTML='';
  if(items.length===0) return;
  items.forEach(item=>{
    const row=document.createElement('div'); row.className='item-row'; row.dataset.itemId=item.id;
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=item.done;
    cb.onchange=()=>handlers.onToggle(item.id);
    const label=document.createElement('span'); label.className='item-text'+(item.done?' done':'');
    label.textContent=item.text;
    const del=document.createElement('button'); del.className='del-btn'; del.textContent='×'; del.setAttribute('aria-label','Eliminar');
    del.onclick=()=>handlers.onDelete(item.id);
    row.appendChild(cb); row.appendChild(label); row.appendChild(del);
    container.appendChild(row);
  });
  if(handlers.onReorder) attachDragReorder(container, handlers.onReorder);
}
function reorderListByIds(list, ids){
  const map={};
  list.forEach(function(item){ map[item.id]=item; });
  const newOrder=ids.map(function(id){ return map[id]; }).filter(Boolean);
  list.length=0;
  newOrder.forEach(function(item){ list.push(item); });

function attachDragReorder(container, onReorder){
  let dragRow=null, pressTimer=null, startY=0, dragging=false;
  container.querySelectorAll(':scope > .item-row').forEach(function(row){
    row.addEventListener('touchstart', function(e){
      if(e.target.closest('input,button')) return;
      startY=e.touches[0].clientY;
      pressTimer=setTimeout(function(){
        dragging=true; dragRow=row;
        row.classList.add('dragging');
        row.style.position='relative'; row.style.zIndex='5';
      }, 350);
    }, {passive:true});
    row.addEventListener('touchmove', function(e){
      if(pressTimer && !dragging){
        if(Math.abs(e.touches[0].clientY-startY)>8){ clearTimeout(pressTimer); pressTimer=null; }
        return;
      }
      if(!dragging || dragRow!==row) return;
      e.preventDefault();
      const touch=e.touches[0];
      const dy=touch.clientY-startY;
      row.style.transform='translateY('+dy+'px)';
      row.style.pointerEvents='none';
      const target=document.elementFromPoint(touch.clientX, touch.clientY);
      row.style.pointerEvents='';
      const overRow=target ? target.closest('.item-row') : null;
      if(overRow && overRow!==row && overRow.parentNode===container){
        const rect=overRow.getBoundingClientRect();
        const before=touch.clientY < rect.top+rect.height/2;
        container.insertBefore(row, before?overRow:overRow.nextSibling);
        startY=touch.clientY;
        row.style.transform='translateY(0px)';
      }
    }, {passive:false});
    row.addEventListener('touchend', function(){
      clearTimeout(pressTimer); pressTimer=null;
      if(!dragging || dragRow!==row) return;
      row.style.transform=''; row.style.position=''; row.style.zIndex='';
      row.classList.remove('dragging');
      dragging=false; dragRow=null;
      const ids=Array.from(container.querySelectorAll(':scope > .item-row')).map(function(r){ return r.dataset.itemId; });
      onReorder(ids);
    });
  });
}
function attachDoubleTap(el, callback){
  let lastTap=0;
  el.addEventListener('touchend', function(e){
    const now=Date.now();
    if(now-lastTap<400){
      e.preventDefault();
      callback();
      lastTap=0;
    } else {
      lastTap=now;
    }
  });
  el.ondblclick=callback;
}

  return d;
}

function buildMonthGridBlock(year, month, todayISO, dated){
  const wrap=document.createElement('div'); wrap.className='card'; wrap.style.marginBottom='16px';

  const totalCells=Math.ceil((startWeekday+daysInMonth)/7)*7;

    else if(i<startWeekday+daysInMonth){ dayNum=i-startWeekday+1; }
    else{ dayNum=i-(startWeekday+daysInMonth)+1; muted=true; cm=month+1; }
    if(cm<0){ cm=11; cy=year-1; } if(cm>11){ cm=0; cy=year+1; }

      const pendMatches=dated.filter(function(it){ return it.date===iso; });
      const pagoMatches=pagosForISO(iso);
      const esEfemeride=efemerideForDiaMes(dayNum, cm+1);

      if(totalDots>0){

function makeEditableTextCell(td, value, onSave, placeholder){
  const span=document.createElement('span'); span.className='cell-display'+(!value?' placeholder':'');
  span.textContent = value || placeholder;
  td.appendChild(span);
  span.onclick=function(){
    const input=document.createElement('input'); input.type='text'; input.className='cell-input'; input.value=value||''; input.autocomplete='off';
    td.replaceChild(input, span); input.focus();
    const commit=function(){ onSave(input.value.trim()); };
    input.onblur=commit;
    input.onkeydown=function(e){ if(e.key==='Enter'){ input.blur(); } };
  };
}
function makeEditableDiaMesCell(td, dia, mes, onSave){
  const span=document.createElement('span'); span.className='cell-display'+(!dia?' placeholder':'');
  if(dia && mes){
    span.style.display='block'; span.style.lineHeight='1.2';
    const dayLine=document.createElement('div'); dayLine.textContent=dia;
    const monthLine=document.createElement('div'); monthLine.style.fontSize='12px'; monthLine.textContent=MESES_CORTOS[mes-1];
    span.appendChild(dayLine); span.appendChild(monthLine);
  } else {
    span.textContent='Sin fecha';
  }
  td.appendChild(span);
  span.onclick=function(){
    const input=document.createElement('input'); input.type='date'; input.className='cell-input';
    const year=new Date().getFullYear();
    if(dia && mes) input.value = year+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
    td.replaceChild(input, span); input.focus();
    const commit=function(){
      if(input.value){
        const parts=input.value.split('-');
        onSave(parseInt(parts[2],10), parseInt(parts[1],10));
      } else {
        onSave(null, null);
      }
    };
    input.onblur=commit;
    input.onchange=commit;
  };
}
function makeEditableSelectCell(td, value, options, onSave){
  const span=document.createElement('span'); span.className='cell-display'+(!value?' placeholder':'');
  span.textContent = value ? (value==='Paralelo' ? 'P' : value) : '⌄';
  td.appendChild(span);
  span.onclick=function(){
    const sel=document.createElement('select'); sel.className='cell-input';
    const blank=document.createElement('option'); blank.value=''; blank.textContent='Elegir';
    sel.appendChild(blank);
    options.forEach(function(o){
      const opt=document.createElement('option'); opt.value=o; opt.textContent=o;
      if(o===value) opt.selected=true;
      sel.appendChild(opt);
    });
    td.replaceChild(sel, span); sel.focus();
    sel.onchange=function(){ onSave(sel.value||null); };
    sel.onblur=function(){ onSave(sel.value||null); };
  };
}

function diasHastaProximaFecha(dia,mes){
  if(!dia||!mes) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const year=hoy.getFullYear();
  let candidato=new Date(year, mes-1, dia);
  if(candidato<hoy){ candidato=new Date(year+1, mes-1, dia); }
  return Math.round((candidato-hoy)/(1000*60*60*24));
}
function autoResetPagosMensuales(){
  let changed=false;
  store.pagosMensuales.forEach(function(p){
    if(p.pagado && p.dia && p.mes){
      const dias=diasHastaProximaFecha(p.dia,p.mes);
      if(dias!==null && dias<=7){
        p.pagado=false;
        changed=true;
      }
    }
  });
  if(changed) saveStore();
  return changed;
}

  autoResetPagosMensuales();

    TASA_OPTIONS.forEach(function(name){
      if(t.valores[name]) partes.push(name+': '+t.valores[name]);
    });
    statusEl.textContent = partes.length
      ? ('Tasas ('+fmtDate(t.actualizado)+'): '+partes.join(' · '))
      : 'No se pudieron obtener las tasas todavía.';
  } else {
    statusEl.textContent='Obteniendo tasas del BCV…';
  }
  renderPagosSection(store.pagosMensuales, 'pagos-mensuales-tbody', 'pagos-mensuales-addwrap', renderPagos, true);
  renderPagosSection(store.pagosProximos, 'pagos-proximos-tbody', 'pagos-proximos-addwrap', renderPagos, false);

/* ---------- nav + init ---------- */
const SCREEN_LABELS={hoy:'Hoy',calendario:'Calendario',pagos:'Pagos',uni:'Uni',kawai:'Kawai',compras:'Compras'};
function isDarkMode(){
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function setNavIconColor(navitem, active){
  const svg=navitem.querySelector('svg.navicon');
  if(!svg) return;
  const dark=isDarkMode();
  const color = active ? '#FFFFFF' : (dark?'#C4B5A8':'#8A7A6C');
  const all=[svg].concat(Array.from(svg.querySelectorAll('*')));
  all.forEach(function(el){
    if(el.hasAttribute('stroke') && el.getAttribute('stroke')!=='none') el.setAttribute('stroke', color);
    if(el.hasAttribute('fill') && el.getAttribute('fill')!=='none') el.setAttribute('fill', color);
  });
}
function refreshAllNavIcons(){
  document.querySelectorAll('.navitem').forEach(function(el){
    setNavIconColor(el, el.classList.contains('active'));
  });
}
function moveNavIndicator(navitem, animate){
  const indicator=document.getElementById('nav-indicator');
  const wrap=navitem.querySelector('.navicon-wrap');
  const navbar=document.querySelector('.navbar');
  if(!indicator || !wrap || !navbar) return;
  const navbarRect=navbar.getBoundingClientRect();
  const wrapRect=wrap.getBoundingClientRect();
  const x=wrapRect.left-navbarRect.left;
  const y=wrapRect.top-navbarRect.top;
  indicator.style.width=wrapRect.width+'px';
  indicator.style.height=wrapRect.height+'px';
  if(!animate){
    indicator.style.transition='none';
    indicator.style.transform='translate('+x+'px,'+y+'px)';
    void indicator.offsetHeight;
    indicator.style.transition='';
  } else {
    indicator.style.transform='translate('+x+'px,'+y+'px)';
  }
}
function initIndicatorDrag(){
  const indicator=document.getElementById('nav-indicator');
  const navbar=document.querySelector('.navbar');
  if(!indicator || !navbar) return;
  let isDragging=false;
  let dragStartX=0;
  const startDrag=function(e){
    isDragging=true;
    dragStartX=(e.touches ? e.touches[0].clientX : e.clientX);
    indicator.style.transition='none';
    indicator.style.cursor='grabbing';
  };
  const onDrag=function(e){
    if(!isDragging) return;
    const currentX=(e.touches ? e.touches[0].clientX : e.clientX);
    const navbarRect=navbar.getBoundingClientRect();
    const relativeX=currentX-navbarRect.left;
    const clampedX=Math.max(0, Math.min(relativeX, navbarRect.width));
    indicator.style.transform='translateX('+clampedX+'px) translateY(0)';
  };
  const endDrag=function(e){
    if(!isDragging) return;
    isDragging=false;
    indicator.style.cursor='grab';
    indicator.style.transition='';
    const currentX=parseInt(indicator.style.transform.match(/translateX\(([^p]+)px/)[1]);
    const navbarRect=navbar.getBoundingClientRect();
    let closestItem=null;
    let closestDist=Infinity;
    document.querySelectorAll('.navitem').forEach(function(item){
      const wrap=item.querySelector('.navicon-wrap');
      if(!wrap) return;
      const wrapRect=wrap.getBoundingClientRect();
      const itemCenterX=wrapRect.left-navbarRect.left+wrapRect.width/2;
      const dist=Math.abs(itemCenterX-currentX);
      if(dist<closestDist){
        closestDist=dist;
        closestItem=item;
      }
    });
    if(closestItem){
      showScreen(closestItem.dataset.screen);
    }
  };
  indicator.addEventListener('mousedown', startDrag);
  indicator.addEventListener('touchstart', startDrag, {passive:false});
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('touchmove', onDrag, {passive:false});
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
}
function showScreen(name){
  setTimeout(function(){ window.scrollTo(0,0); },0);
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
  const screenEl=document.getElementById('screen-'+name);
  if(screenEl) screenEl.scrollTop=0;
  document.getElementById('topbar-screen').textContent=SCREEN_LABELS[name]||'';
  document.querySelectorAll('.screen').forEach(function(el){
    el.classList.toggle('active', el.id==='screen-'+name);
    if(el.id==='screen-'+name) el.scrollTop=0;
  });
  document.querySelectorAll('.navitem').forEach(function(el){
    const isActive = el.dataset.screen===name;
    el.classList.toggle('active', isActive);
    setNavIconColor(el, isActive);
    if(isActive) moveNavIndicator(el, true);
  });
  if(name==='hoy') renderHoy();
  if(name==='calendario') renderCalendario();
  if(name==='pagos'){
    renderPagos();
    fetchTasasIfNeeded();
    const btn=document.getElementById('tasas-refresh-btn');
    if(btn) btn.onclick=function(){ fetchTasasIfNeeded(true); };
  }
  if(name==='uni') renderUni();
  if(name==='kawai') renderKawai();
  if(name==='compras') renderCompras();
}
async function init(){
  await loadStore();
  document.querySelectorAll('.navitem').forEach(function(el){
    el.onclick=function(){ showScreen(el.dataset.screen); };
  });
  fetchTasasIfNeeded();
  const hoyItem=document.querySelector('.navitem[data-screen="hoy"]');
  if(hoyItem) moveNavIndicator(hoyItem, false);
  initIndicatorDrag();
  showScreen('hoy');
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshAllNavIcons);
  }
  window.addEventListener('resize', function(){
    const active=document.querySelector('.navitem.active');
    if(active) moveNavIndicator(active, false);
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
